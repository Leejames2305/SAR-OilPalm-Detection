[project]
name = "agentrsi"
version = "0.0.1"
description = "AgentRSI: autonomous-agent modelling loop for oil-palm SAR triage (Harbor-based)"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api==1.7.53",
    # Pinned on purpose: Harbor is young and its CLI and task schema change between releases.
    "harbor==0.25.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "rasterio==1.5.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[tool.uv]
package = false
