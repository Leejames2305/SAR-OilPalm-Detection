schema_version = "1.4"
artifacts = ["/app/submission", "/app/report", "/app/datasets"]

[task]
name = "agentrsi/spike-m2-verifier"

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 2048

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 4096
network_mode = "public"
